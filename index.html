</style></head><body>
<div id="auth" class="login card"><h1>ClaimSys</h1><p class="muted">Claim Management</p><div id="authMessage"></div><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="email"><br><br><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"><br><br><div class="row"><button type="submit" id="emailAction">Sign in</button><button type="button" class="secondary" id="googleLogin">Continue with Google</button></div><p class="muted" id="authSwitchText">New here? <button type="button" id="register" class="secondary">Create account</button></p></form></div>
<div class="shell hidden" id="shell"><aside class="sidebar"><div class="brand">ClaimSys</div><div id="identity" class="muted" style="color:#c9d3e0"></div><hr><div class="menu" id="nav"></div><hr><button class="secondary" id="logout">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="heading">Records</h1><div class="muted" id="scopeText"></div></div><div class="row"><select id="companySelect" style="min-width:210px"></select><span class="pill" id="roleBadge"></span></div></div><div id="message"></div><div id="content"></div></main></div>
<dialog id="entryDialog"><form id="entryForm"><h2 id="entryTitle">Claim</h2><div class="grid"><div><label>Bill date</label><input id="billDate" type="date" required></div><div><label>Amount (RM)</label><input id="amount" type="number" min="0" step=".01" required></div><div class="field wide"><label>Account</label><select id="entryAccount" required></select></div><div class="field wide"><label>Vendor</label><input id="vendor" maxlength="150" required></div><div style="grid-column:1/-1"><label>Description</label><textarea id="description" maxlength="1000" rows="3" required></textarea></div></div><p class="muted">The bill date determines the reporting month.</p><div class="row"><button type="submit">Save record</button><button type="button" class="secondary" id="cancelEntry">Cancel</button></div></form></dialog>
<dialog id="reviewDialog"><form id="reviewForm"><h2 id="reviewTitle">Review record</h2><p id="reviewSummary" class="muted"></p><label id="reviewNoteLabel" for="reviewNote">Reason</label><textarea id="reviewNote" rows="3" maxlength="500"></textarea><div class="row" style="margin-top:16px"><button type="submit" id="confirmReview">Confirm</button><button type="button" class="secondary" id="cancelReview">Cancel</button></div></form></dialog><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,getDocs,query,where,writeBatch,serverTimestamp,runTransaction}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={apiKey:'AIzaSyDij4NREQCNo5qua8rRyUkE0mgKKAsYNdo',authDomain:'claimsys-ada3b.firebaseapp.com',projectId:'claimsys-ada3b',storageBucket:'claimsys-ada3b.firebasestorage.app',messagingSenderId:'635061198216',appId:'1:635061198216:web:b393cf32e2c91f1aa66e3d'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const S={user:null,profile:null,companies:[],company:null,accounts:[],claims:[],view:'records',year:new Date().getFullYear(),month:String(new Date().getMonth()+1).padStart(2,'0'),period:'month',account:'all',selected:new Set(),editing:null,people:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(arr,current)=>arr.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(v)===String(current)?'selected':'')+'>'+esc(t)+'</option>').join('');
const displayDate=value=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');return m?m[3]+' '+new Date(2000,Number(m[2])-1,1).toLocaleString('en',{month:'short'})+' '+m[1]:value};
const money=n=>(Number(n||0)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const cents=x=>Math.round(Number(x)*100);
const isAdmin=()=>S.profile?.role==='superadmin',isManager=()=>isAdmin()||S.profile?.role==='manager';
const cid=()=>S.company?.id;const companyRef=()=>doc(db,'companies',cid());
const claimsRef=period=>collection(db,'companies',cid(),'months',period,'claims');
const accountList=()=>S.accounts.map(a=>[a.id,a.code+' — '+a.name]);
function flash(t,bad=false){$('message').innerHTML='<div class="notice '+(bad?'error':'')+'">'+esc(t)+'</div>';setTimeout(()=>{if($('message'))$('message').innerHTML=''},7000)}
function ensureCompany(){if(!cid())throw Error('Select a company first.')}
function periodKey(){return S.year+'-'+S.month}
function menus(){let m=['records','reports'];if(isManager())m.push('companies','accounts','staff');if(isAdmin())m.push('managers');return m}
function nav(){ $('nav').innerHTML=menus().map(v=>'<button class="nav '+(S.view===v?'active':'')+'" data-nav="'+v+'">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.selected.clear();draw()})}
function header(){let n=S.view[0].toUpperCase()+S.view.slice(1);$('heading').textContent=n;$('scopeText').textContent=S.company?.name||'Select a company';$('companySelect').innerHTML=opts([['','Choose company'],...S.companies.map(c=>[c.id,c.name])],cid()||'');$('roleBadge').textContent=S.profile?.role||'staff';$('identity').textContent=S.user.email;nav()}
async function loadCompanies(){const role=S.profile.role;let snapshots=[];if(role==='superadmin'){snapshots=(await getDocs(collection(db,'companies'))).docs}else if(role==='manager'){snapshots=(await getDocs(query(collection(db,'companies'),where('managerId','==',S.user.uid)))).docs}else{const memberships=await getDocs(query(collection(db,'companyAccess'),where('userId','==',S.user.uid)));const ids=memberships.docs.map(d=>d.data().companyId);const found=await Promise.all(ids.map(id=>getDoc(doc(db,'companies',id))));snapshots=found.filter(x=>x.exists())}S.companies=snapshots.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.name.localeCompare(b.name));S.company=S.companies.find(c=>c.id===cid())||S.companies[0]||null;await loadAccounts();await loadClaims()}
async function loadAccounts(){S.accounts=[];if(cid()){const snap=await getDocs(collection(db,'companies',cid(),'accounts'));S.accounts=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.code.localeCompare(b.code))}}
async function loadClaims(){S.claims=[];S.selected.clear();if(!cid())return;const periods=S.period==='year'?Array.from({length:12},(_,i)=>S.year+'-'+String(i+1).padStart(2,'0')):[periodKey()];const groups=await Promise.all(periods.map(p=>{let q=claimsRef(p);if(S.account!=='all')q=query(q,where('accountId','==',S.account));return getDocs(q).then(s=>s.docs.map(d=>({...d.data(),id:d.id,period:p})))}));S.claims=groups.flat().sort((a,b)=>a.billDate.localeCompare(b.billDate)||a.id.localeCompare(b.id))}
function filters(){return '<div class="toolbar"><div><label>Account</label><select id="accountFilter">'+opts([['all','All Accounts'],...accountList()],S.account)+'</select></div><div><label>Year</label><select id="yearFilter">'+opts(Array.from({length:8},(_,i)=>[String(new Date().getFullYear()-i),String(new Date().getFullYear()-i)]),S.year)+'</select></div><div><label>Period</label><select id="periodFilter">'+opts([['month','Selected Month'],['year','Full Year']],S.period)+'</select></div>'+(S.period==='month'?'<div><label>Month</label><select id="monthFilter">'+opts(Array.from({length:12},(_,i)=>[String(i+1).padStart(2,'0'),new Date(2000,i,1).toLocaleString('en',{month:'long'})]),S.month)+'</select></div>':'')+'</div>'}
function claimRows(records){return records.map(r=>'<tr>'+(S.view==='records'?'<td><input class="check" type="checkbox" data-check="'+esc(r.id)+'" '+(S.selected.has(r.id)?'checked':'')+' '+(!isManager()||r.status==='Checked'||r.status==='Void'?'disabled':'')+'></td>':'')+'<td>'+esc(displayDate(r.billDate))+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.vendor)+'</td><td>'+esc(r.accountCode)+' · '+esc(r.accountName)+'</td><td class="num">'+money(r.amountCents)+'</td>'+(S.view==='records'?'<td><span class="pill '+esc(r.status)+'">'+esc(r.status)+'</span></td><td><div class="review-actions">'+(isManager()&&r.status!=='Void'?(r.status!=='Checked'?'<button class="secondary" data-status="Checked" data-id="'+esc(r.id)+'">Mark Checked</button>':'')+'<button class="secondary" data-correct="'+esc(r.id)+'">Correct Entry</button>'+(r.status!=='Correction Required'?'<button class="secondary" data-status="Correction Required" data-id="'+esc(r.id)+'">Correction Required</button>':'')+'<button class="danger-link" data-status="Void" data-id="'+esc(r.id)+'">Void Entry</button>':!isManager()&&r.status==='Unchecked'?'<button class="secondary" data-edit="'+esc(r.id)+'">Edit</button>':'')+'</div></td>':'')+'</tr>').join('')}
function recordsView(){let rows=S.claims.filter(r=>r.status!=='Void'||S.view==='records');let total=rows.filter(r=>r.status!=='Void').reduce((n,r)=>n+Number(r.amountCents||0),0);let h=filters()+'<div class="grid"><div class="card"><div class="muted">Active total</div><div class="metric">RM '+money(total)+'</div></div><div class="card"><div class="muted">Entries</div><div class="metric">'+rows.length+'</div></div></div><div class="card"><div class="row spaced"><h3>'+ (S.view==='records'?'Claim records':'Claim report')+'</h3><div class="row">'+(S.view==='records'?'<button id="addClaim">+ Add record</button>'+(isManager()?'<button id="bulkCheck" class="secondary" '+(!S.selected.size?'disabled':'')+'>Mark Checked ('+S.selected.size+')</button>':''):'<button id="excel" class="secondary">Excel</button><button id="pdf" class="secondary">PDF / Print</button>')+'</div></div><div class="tablewrap"><table><thead><tr>'+(S.view==='records'?'<th><input class="check" id="checkAll" type="checkbox" '+(!isManager()?'disabled':'')+'></th>':'')+'<th>Bill Date</th><th>Description</th><th>Vendor</th><th>Account</th><th class="num">Amount (RM)</th>'+(S.view==='records'?'<th>Status</th><th>Review</th>':'')+'</tr></thead><tbody>'+claimRows(rows)+'</tbody><tfoot><tr><th colspan="'+(S.view==='records'?5:4)+'">Active total</th><th class="num">'+money(total)+'</th>'+(S.view==='records'?'<th colspan="2"></th>':'')+'</tr></tfoot></table></div></div>';return h}
function setupFilters(){for(let key of ['account','year','period','month']){let el=$(key+'Filter');if(el)el.onchange=async()=>{S[key]=el.value;await loadClaims();draw()}}}
function setupRecordActions(){if(S.view==='records'){$('addClaim').onclick=()=>openEntry();if(isManager()){$('bulkCheck').onclick=bulkCheck;$('checkAll').onchange=e=>{S.selected=new Set(e.target.checked?S.claims.filter(r=>r.status!=='Checked'&&r.status!=='Void').map(r=>r.id):[]);draw()}}document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?S.selected.add(e.dataset.check):S.selected.delete(e.dataset.check);if(isManager()){$('bulkCheck').textContent='Mark Checked ('+S.selected.size+')';$('bulkCheck').disabled=!S.selected.size}});document.querySelectorAll('[data-edit],[data-correct]').forEach(b=>b.onclick=()=>openEntry(S.claims.find(r=>r.id===(b.dataset.edit||b.dataset.correct))));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>showReview(S.claims.find(r=>r.id===b.dataset.id),b.dataset.status))}else{$('excel').onclick=exportExcel;$('pdf').onclick=exportPdf}}
function draw(){header();let h;if(['records','reports'].includes(S.view))h=cid()?recordsView():(isAdmin()?'<div class="card"><h3>Management Overview</h3><p class="muted">Manage user accounts and companies from the sidebar.</p></div>':isManager()?'<div class="card">No companies yet. Open Companies to create your first company.</div>':'<div class="card">No companies available.</div>');else if(S.view==='companies')h=companiesView();else if(S.view==='accounts')h=accountsView();else if(S.view==='staff')h=staffView();else h=managersView();$('content').innerHTML=h;if(['records','reports'].includes(S.view)&&cid()){setupFilters();setupRecordActions()}if(S.view==='companies')bindCompanies();if(S.view==='accounts')bindAccounts();if(S.view==='staff')bindStaff();if(S.view==='managers')bindManagers()}
function openEntry(record=null){ensureCompany();S.editing=record;$('entryTitle').textContent=record?'Edit claim':'New claim';$('entryAccount').innerHTML=opts(accountList(),record?.accountId||S.accounts.find(a=>a.active!==false)?.id);$('billDate').value=record?.billDate||new Date().toLocaleDateString('en-CA');$('vendor').value=record?.vendor||'';$('description').value=record?.description||'';$('amount').value=record?String(record.amountCents/100):'';$('entryDialog').showModal()}
$('cancelEntry').onclick=()=>$('entryDialog').close();
$('entryForm').onsubmit=async e=>{e.preventDefault();try{ensureCompany();let a=S.accounts.find(x=>x.id===$('entryAccount').value);if(!a||a.active===false)throw Error('Select an active account.');let billDate=$('billDate').value,month=billDate.slice(0,7),amountCents=cents($('amount').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(billDate)||!Number.isSafeInteger(amountCents)||amountCents<0)throw Error('Invalid date or amount.');let data={billDate,description:$('description').value.trim(),vendor:$('vendor').value.trim(),accountId:a.id,accountCode:a.code,accountName:a.name,amountCents,updatedAt:serverTimestamp()};if(!data.description||!data.vendor)throw Error('Description and vendor are required.');if(S.editing){const r=S.editing;if(r.period!==month){throw Error('Changing the bill to another month is not supported in Edit. Void and re-enter it in the correct month.')}if(r.status==='Void')throw Error('Voided entries cannot be edited.');if(isManager()){let ref=doc(claimsRef(r.period),r.id),batch=writeBatch(db);batch.update(ref,data);batch.set(doc(collection(ref,'audit')),{action:'Correct Entry',by:S.user.uid,at:serverTimestamp(),before:{billDate:r.billDate,description:r.description,vendor:r.vendor,accountId:r.accountId,accountCode:r.accountCode,accountName:r.accountName,amountCents:r.amountCents},after:{billDate:data.billDate,description:data.description,vendor:data.vendor,accountId:data.accountId,accountCode:data.accountCode,accountName:data.accountName,amountCents:data.amountCents}});await batch.commit()}else{await updateDoc(doc(claimsRef(r.period),r.id),data)}}else{await addDoc(claimsRef(month),{...data,status:'Unchecked',createdBy:S.user.uid,createdAt:serverTimestamp()})}$('entryDialog').close();await loadClaims();draw();flash('Claim saved.')}catch(err){alert(err.message)}};
async function bulkCheck(){if(!isManager())return flash('Manager permission required.',true);let selected=S.claims.filter(r=>S.selected.has(r.id)&&r.status!=='Checked'&&r.status!=='Void');if(!selected.length)return;if(!confirm('Mark '+selected.length+' records checked?'))return;try{for(let i=0;i<selected.length;i+=200){let batch=writeBatch(db);for(let r of selected.slice(i,i+200)){let ref=doc(claimsRef(r.period),r.id);batch.update(ref,{status:'Checked',reviewedBy:S.user.uid,reviewedAt:serverTimestamp()});batch.set(doc(collection(ref,'audit')),{action:'Mark Checked',by:S.user.uid,at:serverTimestamp()})}await batch.commit()}await loadClaims();draw();flash('Selected records marked checked.')}catch(e){flash(e.message,true)}}
let pendingReview=null;
function showReview(record,status){if(!isManager()||!record||record.status==='Void')return;pendingReview={record,status};$('reviewTitle').textContent=status==='Void'?'Void Entry':status==='Checked'?'Mark Checked':'Correction Required';$('reviewSummary').textContent=displayDate(record.billDate)+' · '+record.description+' · RM '+money(record.amountCents);$('reviewNote').value='';const needsNote=status==='Correction Required';$('reviewNoteLabel').textContent=needsNote?'Reason for correction':'Optional note';$('reviewNote').required=needsNote;$('reviewNote').style.display=status==='Checked'?'none':'block';$('reviewNoteLabel').style.display=status==='Checked'?'none':'block';$('confirmReview').textContent=status==='Void'?'Void Entry':'Confirm '+$('reviewTitle').textContent;$('confirmReview').className=status==='Void'?'danger':'';$('reviewDialog').showModal()}
$('cancelReview').onclick=()=>$('reviewDialog').close();
$('reviewForm').onsubmit=async e=>{e.preventDefault();if(!pendingReview)return;const {record:r,status}=pendingReview,reason=$('reviewNote').value.trim();if(status==='Correction Required'&&!reason)return;try{let ref=doc(claimsRef(r.period),r.id),batch=writeBatch(db);batch.update(ref,{status,reviewedBy:S.user.uid,reviewedAt:serverTimestamp(),reviewNote:reason});batch.set(doc(collection(ref,'audit')),{action:status,by:S.user.uid,at:serverTimestamp(),reason});await batch.commit();$('reviewDialog').close();pendingReview=null;await loadClaims();draw();flash('Review updated.')}catch(err){flash(err.message,true)}};
function companiesView(){return '<div class="card"><h3>Create company</h3><form id="companyForm" class="row"><div class="field wide"><label>Company name</label><input name="name" required maxlength="140"></div><div class="field"><label>Company registration / reference (optional)</label><input name="reference" maxlength="100"></div><button>Create</button></form></div><div class="card"><h3>Companies</h3>'+S.companies.map(c=>'<div class="row spaced" style="padding:9px;border-bottom:1px solid #eee"><b>'+esc(c.name)+'</b><small>'+esc(c.reference||'')+'</small></div>').join('')+'</div>'}
function bindCompanies(){$('companyForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await addDoc(collection(db,'companies'),{name:String(f.get('name')).trim(),reference:String(f.get('reference')).trim(),managerId:isAdmin()?S.user.uid:S.user.uid,createdBy:S.user.uid,createdAt:serverTimestamp()});await loadCompanies();draw();flash('Company created.')}catch(e){flash(e.message,true)}}}
function accountsView(){if(!cid())return '<div class="card">Select a company.</div>';return '<div class="card"><h3>Account setup</h3><form id="accountForm" class="row"><div class="field"><label>Accounting code</label><input name="code" required maxlength="60"></div><div class="field"><label>Account name</label><input name="name" required maxlength="140"></div><button>Add account</button></form></div><div class="card tablewrap"><table><thead><tr><th>Code</th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>'+S.accounts.map(a=>'<tr><td>'+esc(a.code)+'</td><td>'+esc(a.name)+'</td><td>'+ (a.active===false?'Inactive':'Active')+'</td><td><button class="secondary" data-account="'+esc(a.id)+'">Edit</button></td></tr>').join('')+'</tbody></table></div>'}
function bindAccounts(){if(!cid())return;$('accountForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),code=String(f.get('code')).trim(),name=String(f.get('name')).trim();if(S.accounts.some(a=>a.code.toLowerCase()===code.toLowerCase()))return flash('Account code already exists.',true);try{await addDoc(collection(db,'companies',cid(),'accounts'),{code,name,active:true,createdAt:serverTimestamp()});await loadAccounts();draw();flash('Account added.')}catch(e){flash(e.message,true)}};document.querySelectorAll('[data-account]').forEach(b=>b.onclick=async()=>{let a=S.accounts.find(x=>x.id===b.dataset.account);let code=prompt('Accounting code',a.code);if(code===null)return;let name=prompt('Account name',a.name);if(name===null)return;let active=confirm('Keep this account active? Cancel = inactive.');try{await updateDoc(doc(db,'companies',cid(),'accounts',a.id),{code:code.trim(),name:name.trim(),active});await loadAccounts();draw()}catch(e){flash(e.message,true)}})}
function staffView(){if(!cid())return '<div class="card">Select a company first.</div>';return '<div class="card"><h3>Assign Staff to '+esc(S.company.name)+'</h3><p class="muted">Enter a registered user UID to activate Staff access for this company. Assign the same Staff member to additional companies when needed.</p><form id="staffForm" class="row"><div class="field"><label>Staff Firebase UID</label><input name="uid" required></div><button>Grant access</button></form><hr><button id="loadStaff" class="secondary">Show assigned Staff</button><div id="staffList"></div></div>'}
function bindStaff(){if(!cid())return;$('staffForm').onsubmit=async e=>{e.preventDefault();let uid=String(new FormData(e.target).get('uid')).trim();try{let p=await getDoc(doc(db,'users',uid));if(!p.exists()||p.data().role!=='staff')throw Error('Staff UID not found. Staff must register first.');await setDoc(doc(db,'companyAccess',cid()+'_'+uid),{companyId:cid(),userId:uid,managerId:S.company.managerId,createdAt:serverTimestamp()});flash('Staff access granted.')}catch(e){flash(e.message,true)}};$('loadStaff').onclick=async()=>{try{let s=await getDocs(query(collection(db,'companyAccess'),where('companyId','==',cid()),where('managerId','==',S.company.managerId)));$('staffList').innerHTML=s.docs.map(d=>'<div class="row spaced" style="margin:10px 0">'+esc(d.data().userId)+'<button class="danger" data-revoke="'+esc(d.id)+'">Revoke</button></div>').join('')||'<p class="muted">No staff assigned.</p>';document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove staff access?'))return;try{await deleteDoc(doc(db,'companyAccess',b.dataset.revoke));$('loadStaff').click()}catch(e){flash(e.message,true)}})}catch(e){flash(e.message,true)}}}
function managersView(){return '<div class="card"><h3>Manager accounts</h3><p class="muted">A new Manager registers with email/password or Google first. Use their Firebase UID to promote them. Do not share passwords.</p><form id="managerForm" class="row"><div class="field wide"><label>Registered user UID</label><input name="uid" required></div><button>Promote to Manager</button></form></div><div class="card"><p>Superadmin has system-wide access. Manager permissions are stored in Firestore and enforced by security rules.</p></div>'}
function bindManagers(){$('managerForm').onsubmit=async e=>{e.preventDefault();let uid=String(new FormData(e.target).get('uid')).trim();try{let ref=doc(db,'users',uid),p=await getDoc(ref);if(!p.exists())throw Error('User must register first.');if(p.data().role==='superadmin')throw Error('Cannot change superadmin.');await updateDoc(ref,{role:'manager',active:true});flash('Manager promoted.')}catch(e){flash(e.message,true)}}}
function reportData(){return S.claims.filter(r=>r.status!=='Void').map(r=>({date:r.billDate,description:r.description,vendor:r.vendor,accountCode:r.accountCode,accountName:r.accountName,amount:r.amountCents/100}))}
function filename(ext){return 'claimsys_'+(S.company?.name||'company').replace(/[^\w-]/g,'_')+'_'+S.year+(S.period==='month'?'-'+S.month:'')+'.'+ext}
function exportExcel(){if(!window.XLSX)return alert('Excel library unavailable. Check your internet connection.');let rows=reportData(),wb=XLSX.utils.book_new(),header=[['Company',S.company.name],['Account filter',S.account==='all'?'All Accounts':S.accounts.find(a=>a.id===S.account)?.name],['Period',S.period==='year'?String(S.year):periodKey()],[],['Bill Date','Description','Vendor','Account Code','Account Name','Amount (RM)']],values=rows.map(r=>[r.date,r.description,r.vendor,r.accountCode,r.accountName,r.amount]);let sheet=XLSX.utils.aoa_to_sheet([...header,...values,[],['','','','','TOTAL',rows.reduce((s,r)=>s+r.amount,0)]]);sheet['!cols']=[{wch:14},{wch:40},{wch:25},{wch:17},{wch:28},{wch:17}];XLSX.utils.book_append_sheet(wb,sheet,'Claims');XLSX.writeFile(wb,filename('xlsx'))}
function exportPdf(){if(!window.jspdf?.jsPDF)return alert('PDF library unavailable. Check your internet connection.');const docx=new window.jspdf.jsPDF({orientation:'landscape'}),r=reportData(),acct=S.account==='all'?'All Accounts':S.accounts.find(a=>a.id===S.account)?.name||'';docx.setFontSize(17);docx.text(S.company.name.slice(0,95),14,17);docx.setFontSize(10);docx.text('Claim Report | '+acct+' | '+(S.period==='year'?S.year:periodKey()),14,25);docx.autoTable({startY:31,head:[['Bill Date','Description','Vendor','Account Code','Account Name','Amount (RM)']],body:r.map(a=>[a.date,a.description,a.vendor,a.accountCode,a.accountName,a.amount.toFixed(2)]),foot:[['','','','','TOTAL',r.reduce((s,a)=>s+a.amount,0).toFixed(2)]],styles:{fontSize:9},headStyles:{fillColor:[29,51,85]},didDrawPage:arg=>{docx.setFontSize(9);docx.text('Page '+docx.internal.getCurrentPageInfo().pageNumber,275,201)}});docx.save(filename('pdf'))}
$('companySelect').onchange=async e=>{S.company=S.companies.find(c=>c.id===e.target.value)||null;S.account='all';await loadAccounts();await loadClaims();draw()};
$('logout').onclick=()=>signOut(auth);
let creatingAccount=false;
$('register').onclick=()=>{creatingAccount=!creatingAccount;$('emailAction').textContent=creatingAccount?'Create account':'Sign in';$('register').textContent=creatingAccount?'Back to sign in':'Create account';$('authSwitchText').firstChild.textContent=creatingAccount?'Already have an account? ':'New here? ';$('password').autocomplete=creatingAccount?'new-password':'current-password';$('authMessage').textContent=''};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{if(creatingAccount){await createUserWithEmailAndPassword(auth,$('email').value,$('password').value)}else{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}}catch(e){$('authMessage').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}};
$('googleLogin').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('authMessage').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}};
onAuthStateChanged(auth,async user=>{S.user=user;if(!user){$('auth').classList.remove('hidden');$('shell').classList.add('hidden');return}try{const ref=doc(db,'users',user.uid);let profile=await getDoc(ref);if(!profile.exists()){await setDoc(ref,{email:user.email||'',role:null,active:false});profile=await getDoc(ref)}S.profile=profile.data();if(S.profile.active!==true||!['superadmin','manager','staff'].includes(S.profile.role)){await signOut(auth);$('authMessage').innerHTML='<div class="notice error">Access Denied — You are not authorised to access ClaimSys.</div>';return}$('auth').classList.add('hidden');$('shell').classList.remove('hidden');try{await loadCompanies()}catch(loadError){console.error('Company loading failed:',loadError);S.companies=[];S.company=null;S.accounts=[];S.claims=[];S.view=isAdmin()?'managers':isManager()?'companies':'records';draw();flash('Unable to load companies: '+loadError.message,true);return}draw();if(S.profile.role==='staff'&&!S.companies.length)flash('Please contact your administrator for access.')}catch(e){$('authMessage').innerHTML='<div class="notice error">'+esc(e.message)+'</div>';console.error(e)}});
</script><script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script></body></html>
