<dialog id="entryDialog"><form id="entryForm"><h2 id="entryTitle">Claim</h2><div class="grid"><div><label>Bill date</label><input id="billDate" type="date" required></div><div><label>Ref. No.</label><input id="refNo" maxlength="100" placeholder="Bill / Invoice No."></div><div><label>Amount (RM)</label><input id="amount" type="number" min="0" step=".01" required></div><div class="field wide"><label>Account</label><select id="entryAccount" required></select></div><div class="field wide suggest-wrap"><label>Vendor</label><input id="vendor" maxlength="150" autocomplete="off" required><div id="vendorSuggestions" class="suggest-list hidden"></div></div><div class="suggest-wrap" style="grid-column:1/-1"><label>Description</label><textarea id="description" maxlength="1000" rows="3" autocomplete="off" required></textarea><div id="descriptionSuggestions" class="suggest-list hidden"></div></div></div><p class="muted">The bill date determines the reporting month.</p><div class="row"><button type="submit">Save record</button><button type="button" class="secondary" id="cancelEntry">Cancel</button></div></form></dialog>
<dialog id="reviewDialog"><form id="reviewForm"><h2 id="reviewTitle">Review record</h2><p id="reviewSummary" class="muted"></p><label id="reviewNoteLabel" for="reviewNote">Reason</label><textarea id="reviewNote" rows="3" maxlength="500"></textarea><div class="row" style="margin-top:16px"><button type="submit" id="confirmReview">Confirm</button><button type="button" class="secondary" id="cancelReview">Cancel</button></div></form></dialog><script type="module">

const config={apiKey:'AIzaSyDij4NREQCNo5qua8rRyUkE0mgKKAsYNdo',authDomain:'claimsys-ada3b.firebaseapp.com',projectId:'claimsys-ada3b',storageBucket:'claimsys-ada3b.firebasestorage.app',messagingSenderId:'635061198216',appId:'1:635061198216:web:b393cf32e2c91f1aa66e3d'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const S={user:null,profile:null,companies:[],company:null,accounts:[],claims:[],view:'records',year:new Date().getFullYear(),month:String(new Date().getMonth()+1).padStart(2,'0'),period:'month',account:'all',selected:new Set(),editing:null,people:[],suggestions:[],suggestCompany:null,suggestionsReady:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(arr,current)=>arr.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(v)===String(current)?'selected':'')+'>'+esc(t)+'</option>').join('');

const money=n=>(Number(n||0)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const cents=x=>Math.round(Number(x)*100);
const isAdmin=()=>S.profile?.role==='superadmin',isManager=()=>isAdmin()||S.profile?.role==='manager';
const cid=()=>S.company?.id;const companyRef=()=>doc(db,'companies',cid());
const claimsRef=period=>collection(db,'companies',cid(),'months',period,'claims');

function flash(t,bad=false){$('message').innerHTML='<div class="notice '+(bad?'error':'')+'">'+esc(t)+'</div>';setTimeout(()=>{if($('message'))$('message').innerHTML=''},7000)}
function ensureCompany(){if(!cid())throw Error('Select a company first.')}
function periodKey(){return S.year+'-'+S.month}
function menus(){let m=['records','reports'];if(isManager())m.push('companies','accounts','staff');if(isAdmin())m.push('managers');return m}
function nav(){ $('nav').innerHTML=menus().map(v=>'<button class="nav '+(S.view===v?'active':'')+'" data-nav="'+v+'">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.selected.clear();draw()})}
function header(){let n=S.view[0].toUpperCase()+S.view.slice(1);$('heading').textContent=n;$('scopeText').textContent=S.company?.name||'Select a company';$('companySelect').innerHTML=opts([['','Choose company'],...S.companies.map(c=>[c.id,c.name])],cid()||'');$('roleBadge').textContent=S.profile?.role||'staff';$('identity').textContent=S.user.email;nav()}
async function loadCompanies(){const role=S.profile.role;let snapshots=[];if(role==='superadmin'){snapshots=(await getDocs(collection(db,'companies'))).docs}else if(role==='manager'){snapshots=(await getDocs(query(collection(db,'companies'),where('managerId','==',S.user.uid)))).docs}else{const memberships=await getDocs(query(collection(db,'companyAccess'),where('userId','==',S.user.uid)));const ids=memberships.docs.map(d=>d.data().companyId);const found=await Promise.all(ids.map(id=>getDoc(doc(db,'companies',id))));snapshots=found.filter(x=>x.exists())}S.companies=snapshots.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.name.localeCompare(b.name));S.company=S.companies.find(c=>c.id===cid())||S.companies[0]||null;await loadAccounts();await loadClaims()}
async function loadAccounts(){S.accounts=[];if(cid()){const snap=await getDocs(collection(db,'companies',cid(),'accounts'));S.accounts=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.code.localeCompare(b.code))}}
async function loadClaims(){S.claims=[];S.selected.clear();if(!cid())return;const periods=S.period==='year'?Array.from({length:12},(_,i)=>S.year+'-'+String(i+1).padStart(2,'0')):[periodKey()];const groups=await Promise.all(periods.map(p=>{let q=claimsRef(p);if(S.account!=='all')q=query(q,where('accountId','==',S.account));return getDocs(q).then(s=>s.docs.map(d=>({...d.data(),id:d.id,period:p})))}));S.claims=groups.flat().sort((a,b)=>a.billDate.localeCompare(b.billDate)||a.id.localeCompare(b.id))}
function filters(){return '<div class="toolbar"><div><label>Account</label><select id="accountFilter">'+opts([['all','All Accounts'],...accountList()],S.account)+'</select></div><div><label>Year</label><select id="yearFilter">'+opts(Array.from({length:8},(_,i)=>[String(new Date().getFullYear()-i),String(new Date().getFullYear()-i)]),S.year)+'</select></div><div><label>Period</label><select id="periodFilter">'+opts([['month','Selected Month'],['year','Full Year']],S.period)+'</select></div>'+(S.period==='month'?'<div><label>Month</label><select id="monthFilter">'+opts(Array.from({length:12},(_,i)=>[String(i+1).padStart(2,'0'),new Date(2000,i,1).toLocaleString('en',{month:'long'})]),S.month)+'</select></div>':'')+'</div>'}
function claimRows(records){return records.map(r=>'<tr>'+(S.view==='records'?'<td><input class="check" type="checkbox" data-check="'+esc(r.id)+'" '+(S.selected.has(r.id)?'checked':'')+' '+(!isManager()||r.status==='Checked'||r.status==='Void'?'disabled':'')+'></td>':'')+'<td>'+esc(displayDate(r.billDate))+'</td><td>'+esc(r.refNo||'')+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.vendor)+'</td><td>'+esc(r.accountCode)+' · '+esc(r.accountName)+'</td><td class="num">'+money(r.amountCents)+'</td>'+(S.view==='records'?'<td><span class="pill '+esc(r.status)+'">'+esc(r.status)+'</span></td><td><div class="review-actions">'+(isManager()&&r.status!=='Void'?(r.status!=='Checked'?'<button class="secondary" data-status="Checked" data-id="'+esc(r.id)+'">Mark Checked</button>':'')+'<button class="secondary" data-correct="'+esc(r.id)+'">Correct Entry</button>'+(r.status!=='Correction Required'?'<button class="secondary" data-status="Correction Required" data-id="'+esc(r.id)+'">Correction Required</button>':'')+'<button class="danger-link" data-status="Void" data-id="'+esc(r.id)+'">Void Entry</button>':!isManager()&&r.status==='Unchecked'?'<button class="secondary" data-edit="'+esc(r.id)+'">Edit</button>':'')+'</div></td>':'')+'</tr>').join('')}
function reportGroups(){const grouped=new Map();for(const r of S.claims.filter(x=>x.status!=='Void')){const key=r.accountId||r.accountCode+'|'+r.accountName;if(!grouped.has(key))grouped.set(key,{code:r.accountCode||'',name:r.accountName||'',items:[],total:0});const g=grouped.get(key);g.items.push(r);g.total+=Number(r.amountCents||0)}return [...grouped.values()].map(g=>({...g,items:g.items.sort((a,b)=>a.billDate.localeCompare(b.billDate)||a.id.localeCompare(b.id))})).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})||a.name.localeCompare(b.name))}
function reportPeriodLabel(){return S.period==='year'?'Full Year '+S.year:new Date(Number(S.year),Number(S.month)-1,1).toLocaleDateString('en-MY',{month:'long',year:'numeric'})}
function groupedReportView(){const groups=reportGroups(),single=S.account!=='all',sum=groups.reduce((n,g)=>n+g.total,0),count=groups.reduce((n,g)=>n+g.items.length,0);let h=filters()+'<div class="card"><div class="row spaced"><div><h3>'+esc(single?(groups[0]?.name||S.accounts.find(a=>a.id===S.account)?.name||'Account report'):'Claim report')+'</h3><div class="muted">'+esc(S.company.name)+' · '+esc(reportPeriodLabel())+'</div></div><div class="row"><button id="excel" class="secondary">Excel</button><button id="pdf" class="secondary">PDF / Print</button></div></div>';if(!groups.length)h+='<p class="muted">No entries for the selected account and period.</p>';for(const g of groups){h+='<h3 style="margin:22px 0 9px">'+esc(g.code)+' · '+esc(g.name)+'</h3><div class="tablewrap"><table><thead><tr><th>Bill Date</th><th>Ref. No.</th><th>Description</th><th>Vendor</th><th class="num">Amount (RM)</th></tr></thead><tbody>'+g.items.map(r=>'<tr><td>'+esc(displayDate(r.billDate))+'</td><td>'+esc(r.refNo||'')+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.vendor)+'</td><td class="num">'+money(r.amountCents)+'</td></tr>').join('')+'</tbody><tfoot><tr><th colspan="4">Total '+esc(g.name)+'</th><th class="num">'+money(g.total)+'</th></tr></tfoot></table></div>'}if(!single)h+='<div class="row spaced" style="margin-top:20px;padding-top:14px;border-top:2px solid #d8e1ef"><strong>Grand Total · '+esc(reportPeriodLabel())+'</strong><strong>RM '+money(sum)+'</strong></div>';h+='<p class="muted" style="margin-top:12px">'+count+' entries · '+groups.length+' account(s)</p></div>';return h}
function recordsView(){if(S.view==='reports')return groupedReportView();let rows=S.claims.filter(r=>r.status!=='Void'||S.view==='records');let total=rows.filter(r=>r.status!=='Void').reduce((n,r)=>n+Number(r.amountCents||0),0);let h=filters()+'<div class="grid"><div class="card"><div class="muted">Active total</div><div class="metric">RM '+money(total)+'</div></div><div class="card"><div class="muted">Entries</div><div class="metric">'+rows.length+'</div></div></div><div class="card"><div class="row spaced"><h3>'+ (S.view==='records'?'Claim records':'Claim report')+'</h3><div class="row">'+(S.view==='records'?'<button id="addClaim">+ Add record</button>'+(isManager()?'<button id="bulkCheck" class="secondary" '+(!S.selected.size?'disabled':'')+'>Mark Checked ('+S.selected.size+')</button>':''):'<button id="excel" class="secondary">Excel</button><button id="pdf" class="secondary">PDF / Print</button>')+'</div></div><div class="tablewrap"><table><thead><tr>'+(S.view==='records'?'<th><input class="check" id="checkAll" type="checkbox" '+(!isManager()?'disabled':'')+'></th>':'')+'<th>Bill Date</th><th>Ref. No.</th><th>Description</th><th>Vendor</th><th>Account</th><th class="num">Amount (RM)</th>'+(S.view==='records'?'<th>Status</th><th>Review</th>':'')+'</tr></thead><tbody>'+claimRows(rows)+'</tbody><tfoot><tr><th colspan="'+(S.view==='records'?6:5)+'">Active total</th><th class="num">'+money(total)+'</th>'+(S.view==='records'?'<th colspan="2"></th>':'')+'</tr></tfoot></table></div></div>';return h}
function setupFilters(){for(let key of ['account','year','period','month']){let el=$(key+'Filter');if(el)el.onchange=async()=>{S[key]=el.value;await loadClaims();draw()}}}
function setupRecordActions(){if(S.view==='records'){$('addClaim').onclick=()=>openEntry();if(isManager()){$('bulkCheck').onclick=bulkCheck;$('checkAll').onchange=e=>{S.selected=new Set(e.target.checked?S.claims.filter(r=>r.status!=='Checked'&&r.status!=='Void').map(r=>r.id):[]);draw()}}document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?S.selected.add(e.dataset.check):S.selected.delete(e.dataset.check);if(isManager()){$('bulkCheck').textContent='Mark Checked ('+S.selected.size+')';$('bulkCheck').disabled=!S.selected.size}});document.querySelectorAll('[data-edit],[data-correct]').forEach(b=>b.onclick=()=>openEntry(S.claims.find(r=>r.id===(b.dataset.edit||b.dataset.correct))));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>showReview(S.claims.find(r=>r.id===b.dataset.id),b.dataset.status))}else{$('excel').onclick=exportExcel;$('pdf').onclick=exportPdf}}
function draw(){header();let h;if(['records','reports'].includes(S.view))h=cid()?recordsView():(isAdmin()?'<div class="card"><h3>Management Overview</h3><p class="muted">Manage user accounts and companies from the sidebar.</p></div>':isManager()?'<div class="card">No companies yet. Open Companies to create your first company.</div>':'<div class="card">No companies available.</div>');else if(S.view==='companies')h=companiesView();else if(S.view==='accounts')h=accountsView();else if(S.view==='staff')h=staffView();else h=managersView();$('content').innerHTML=h;if(['records','reports'].includes(S.view)&&cid()){setupFilters();setupRecordActions()}if(S.view==='companies')bindCompanies();if(S.view==='accounts')bindAccounts();if(S.view==='staff')bindStaff();if(S.view==='managers')bindManagers()}
function hideSuggestions(){for(const id of ['vendorSuggestions','descriptionSuggestions'])$(id).classList.add('hidden')}
function historyPeriods(){const now=new Date(),months=[];for(let i=0;i<24;i++){const date=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0'))}return months}
async function loadSuggestionHistory(){const companyId=cid();if(!companyId||S.suggestionsReady&&S.suggestCompany===companyId)return;S.suggestCompany=companyId;S.suggestionsReady=false;const periods=historyPeriods();const merged=new Map();for(const r of S.claims){if(r.status!=='Void')merged.set(r.period+'/'+r.id,r)}const data=await Promise.allSettled(periods.map(period=>getDocs(collection(db,'companies',companyId,'months',period,'claims'))));if(cid()!==companyId)return;data.forEach((result,i)=>{if(result.status==='fulfilled'){result.value.docs.forEach(d=>{const r=d.data();if(r.status!=='Void')merged.set(periods[i]+'/'+d.id,r)})}});const unique=new Map();for(const r of merged.values()){if(!r.description||!r.vendor)continue;const key=[r.description.trim(),r.vendor.trim(),r.accountId].join('\\u001f').toLowerCase();const prev=unique.get(key);if(!prev||String(r.billDate)>String(prev.billDate))unique.set(key,{description:r.description.trim(),vendor:r.vendor.trim(),accountId:r.accountId,billDate:r.billDate})}S.suggestions=[...unique.values()].sort((a,b)=>String(b.billDate).localeCompare(String(a.billDate)));S.suggestionsReady=true}
const suggestionIndex={vendor:-1,description:-1};
function selectSuggestion(field,index){const box=$(field+'Suggestions'),items=[...box.querySelectorAll('.suggest-choice')];if(!items[index])return;$(field).value=items[index].textContent;hideSuggestions();$(field).focus()}
function showSuggestions(field){suggestionIndex[field]=-1;const box=$(field+'Suggestions');if(S.editing||!S.suggestionsReady){box.classList.add('hidden');return}const term=$(field).value.trim().toLowerCase();if(term.length<2){box.classList.add('hidden');return}const seen=new Set();const matches=S.suggestions.filter(x=>{const value=String(x[field]||'').trim(),key=value.toLowerCase();if(!key.includes(term)||seen.has(key))return false;seen.add(key);return true}).slice(0,5);box.replaceChildren();if(!matches.length){box.classList.add('hidden');return}matches.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='suggest-choice';b.textContent=x[field];b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>selectSuggestion(field,[...box.children].indexOf(b)));box.append(b)});box.classList.remove('hidden')}
for(const field of ['vendor','description']){$(field).addEventListener('input',()=>showSuggestions(field));$(field).addEventListener('focus',()=>showSuggestions(field));$(field).addEventListener('keydown',e=>{const box=$(field+'Suggestions'),items=[...box.querySelectorAll('.suggest-choice')];if(e.key==='Escape'){hideSuggestions();suggestionIndex[field]=-1;return}if(box.classList.contains('hidden')||!items.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const step=e.key==='ArrowDown'?1:-1;suggestionIndex[field]=(suggestionIndex[field]+step+items.length)%items.length;items.forEach((item,i)=>item.classList.toggle('is-active',i===suggestionIndex[field]));items[suggestionIndex[field]].scrollIntoView({block:'nearest'});return}if(e.key==='Enter'&&suggestionIndex[field]>=0){e.preventDefault();selectSuggestion(field,suggestionIndex[field])}});$(field).addEventListener('blur',()=>{setTimeout(()=>$(field+'Suggestions').classList.add('hidden'),180)})}
document.getElementById('entryDialog').addEventListener('click',e=>{if(!e.target.closest('.suggest-wrap'))hideSuggestions()});
function openEntry(record=null){ensureCompany();S.editing=record;$('entryTitle').textContent=record?'Edit claim':'New claim';$('entryAccount').innerHTML=opts(accountList(),record?.accountId||S.accounts.find(a=>a.active!==false)?.id);$('billDate').value=record?.billDate||new Date().toLocaleDateString('en-CA');$('refNo').value=record?.refNo||'';$('vendor').value=record?.vendor||'';$('description').value=record?.description||'';$('amount').value=record?String(record.amountCents/100):'';hideSuggestions();$('entryDialog').showModal();if(!record){const companyId=cid();loadSuggestionHistory().then(()=>{if(cid()===companyId&&$('entryDialog').open&& !S.editing){showSuggestions('vendor');showSuggestions('description')}}).catch(console.error)}}

$('entryForm').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing||e.shiftKey||e.ctrlKey||e.altKey||e.metaKey)return;const target=e.target;if(target.tagName==='TEXTAREA'||target.tagName==='BUTTON')return;if(target.id==='vendor'&&suggestionIndex.vendor>=0&&!$('vendorSuggestions').classList.contains('hidden'))return;e.preventDefault();$('entryForm').requestSubmit()});
let claimSaving=false;
$('entryForm').onsubmit=async e=>{e.preventDefault();if(claimSaving)return;claimSaving=true;const saveButton=$('entryForm').querySelector('button[type="submit"]');if(saveButton)saveButton.disabled=true;try{ensureCompany();let a=S.accounts.find(x=>x.id===$('entryAccount').value);if(!a||a.active===false)throw Error('Select an active account.');let billDate=$('billDate').value,month=billDate.slice(0,7),amountCents=cents($('amount').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(billDate)||!Number.isSafeInteger(amountCents)||amountCents<0)throw Error('Invalid date or amount.');let data={billDate,refNo:$('refNo').value.trim(),description:$('description').value.trim(),vendor:$('vendor').value.trim(),accountId:a.id,accountCode:a.code,accountName:a.name,amountCents,updatedAt:serverTimestamp()};if(!data.description||!data.vendor)throw Error('Description and vendor are required.');if(S.editing){const r=S.editing;if(r.status==='Void')throw Error('Voided entries cannot be edited.');const oldRef=doc(claimsRef(r.period),r.id);const before={billDate:r.billDate,refNo:r.refNo||'',description:r.description,vendor:r.vendor,accountId:r.accountId,accountCode:r.accountCode,accountName:r.accountName,amountCents:r.amountCents};const after={billDate:data.billDate,refNo:data.refNo,description:data.description,vendor:data.vendor,accountId:data.accountId,accountCode:data.accountCode,accountName:data.accountName,amountCents:data.amountCents};if(r.period!==month){if(!isManager())throw Error('Changing the bill month needs a Manager to approve the correction.');const newRef=doc(claimsRef(month),r.id);const existing=await getDoc(newRef);if(existing.exists())throw Error('A record with this ID already exists in the destination month.');const batch=writeBatch(db);batch.update(oldRef,{status:'Void',reviewedBy:S.user.uid,reviewedAt:serverTimestamp(),reviewNote:'Moved to '+month,updatedAt:serverTimestamp()});batch.set(doc(collection(oldRef,'audit')),{action:'Void',by:S.user.uid,at:serverTimestamp(),reason:'Bill date corrected; moved to '+month,newPeriod:month,newRecordId:r.id});batch.set(newRef,{...data,status:'Unchecked',createdBy:S.user.uid,createdAt:serverTimestamp(),originalCreatedBy:r.originalCreatedBy||r.createdBy,movedFromPeriod:r.period,movedFromId:r.id});batch.set(doc(collection(newRef,'audit')),{action:'Correct Entry',by:S.user.uid,at:serverTimestamp(),before,after,oldPeriod:r.period,newPeriod:month});await batch.commit();S.year=Number(month.slice(0,4));S.month=month.slice(5,7);S.period='month';S.account='all'}else if(isManager()){let batch=writeBatch(db);batch.update(oldRef,data);batch.set(doc(collection(oldRef,'audit')),{action:'Correct Entry',by:S.user.uid,at:serverTimestamp(),before,after});await batch.commit()}else{await updateDoc(oldRef,data)}}else{await addDoc(claimsRef(month),{...data,status:'Unchecked',createdBy:S.user.uid,createdAt:serverTimestamp()})}if(!S.editing){S.year=Number(month.slice(0,4));S.month=month.slice(5,7);S.period='month';S.account='all'}$('entryDialog').close();S.suggestionsReady=false;await loadClaims();draw();flash('Claim saved.')}catch(err){alert(err.message)}finally{claimSaving=false;if(saveButton)saveButton.disabled=false}};
async function bulkCheck(){if(!isManager())return flash('Manager permission required.',true);let selected=S.claims.filter(r=>S.selected.has(r.id)&&r.status!=='Checked'&&r.status!=='Void');if(!selected.length)return;if(!confirm('Mark '+selected.length+' records checked?'))return;try{for(let i=0;i<selected.length;i+=200){let batch=writeBatch(db);for(let r of selected.slice(i,i+200)){let ref=doc(claimsRef(r.period),r.id);batch.update(ref,{status:'Checked',reviewedBy:S.user.uid,reviewedAt:serverTimestamp()});batch.set(doc(collection(ref,'audit')),{action:'Mark Checked',by:S.user.uid,at:serverTimestamp()})}await batch.commit()}await loadClaims();draw();flash('Selected records marked checked.')}catch(e){flash(e.message,true)}}

$('reviewForm').onsubmit=async e=>{e.preventDefault();if(!pendingReview)return;const {record:r,status}=pendingReview,reason=$('reviewNote').value.trim();if(status==='Correction Required'&&!reason)return;try{let ref=doc(claimsRef(r.period),r.id),batch=writeBatch(db);batch.update(ref,{status,reviewedBy:S.user.uid,reviewedAt:serverTimestamp(),reviewNote:reason});batch.set(doc(collection(ref,'audit')),{action:status,by:S.user.uid,at:serverTimestamp(),reason});await batch.commit();$('reviewDialog').close();pendingReview=null;await loadClaims();draw();flash('Review updated.')}catch(err){flash(err.message,true)}};

function exportExcel(){if(!window.XLSX)return alert('Excel library unavailable. Check your internet connection.');const groups=reportGroups(),single=S.account!=='all',lines=[['Company',S.company.name],['Period',reportPeriodLabel()],['Account',single?(groups[0]?.code+' · '+groups[0]?.name||S.accounts.find(a=>a.id===S.account)?.name||'Selected account'):'All Accounts'],[]];let grand=0;for(const g of groups){lines.push([g.code+' · '+g.name],['Bill Date','Ref. No.','Description','Vendor','Amount (RM)']);for(const r of g.items)lines.push([r.billDate,r.refNo||'',r.description,r.vendor,r.amountCents/100]);lines.push(['','','', 'Total '+g.name,g.total/100],[]);grand+=g.total}if(!single)lines.push(['','','','GRAND TOTAL',grand/100]);const sheet=XLSX.utils.aoa_to_sheet(lines);sheet['!cols']=[{wch:20},{wch:22},{wch:45},{wch:36},{wch:18}];for(const key of Object.keys(sheet)){if(key[0]==='!')continue;const cell=sheet[key];if(typeof cell.v==='number')cell.z='#,##0.00'}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet,'Claims');XLSX.writeFile(wb,filename('xlsx'))}
